site_name: SDD
site_description: Data and Decision Sciences Engineering Program
site_url: https://supaerodatascience.github.io/
site_dir: site
strict: false
use_directory_urls: false

theme:
  name: 'material'
  palette:
    primary: light blue
    accent: light blue
  logo: 'https://raw.githubusercontent.com/SupaeroDataScience/SupaeroDataScience.github.io/master/favicon.ico'
  favicon: 'https://raw.githubusercontent.com/SupaeroDataScience/SupaeroDataScience.github.io/master/favicon.ico'
  features:
    - navigation.sections

repo_name: SupaeroDataScience
repo_url: https://github.com/SupaeroDataScience/

nav:
- Home: index.md

- Classes:
  - Fundamentals of Decision Making:
    - Overview: 310/index.md
    - Data Engineering Fundamentals: 310/ctf.md
    - Statistical Models: https://supaerodatascience.github.io/stat-ml/
    - Optimization: 310/opti.md

  - Machine Learning: 
    - Overview: aml.md
    - Machine Learning: https://supaerodatascience.github.io/machine-learning/
    - Deep Larning: https://supaerodatascience.github.io/deep-learning/
    - Reinforcement learning: https://supaerodatascience.github.io/reinforcement-learning/

  - Data Engineering: 'https://supaerodatascience.github.io/DE/'

  - Applied Data Science:
      - Overview: 313/index.md
      - Hackathon: 313/hackathon.md

  - Seminars: seminars.md

- Resources:
  - For current students: infostudents.md
  - For prospective students: students.md
  - For partners: partners.md
  - Contact: contact.md

markdown_extensions:
- markdown.extensions.codehilite:
    guess_lang: false
- toc:
    permalink: 🔗
- admonition
- codehilite
- extra
- attr_list
- pymdownx.details
- pymdownx.superfences

plugins:
- search
